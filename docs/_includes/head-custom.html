<!-- Favicons (the theme includes this file inside <head>). -->
<link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}">
<meta name="theme-color" content="#173b63">
{% if site.goatcounter %}
<!-- Visitor counts by GoatCounter: no cookies and no personal data, so no
     consent banner is needed. The site code is set in _config.yml. -->
<script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
{% endif %}
{% if page.noindex %}<meta name="robots" content="noindex, follow">{% endif %}
{% if page.url == "/" %}{% include software-jsonld.html %}{% endif %}
