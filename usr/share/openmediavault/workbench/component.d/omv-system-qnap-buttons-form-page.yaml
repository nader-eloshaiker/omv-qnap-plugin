version: "1.0"
type: component
data:
  name: omv-system-qnap-buttons-form-page
  type: formPage
  config:
    request:
      service: Qnap
      get:
        method: getSettings
      post:
        method: setButtonSettings
    fields:
      - type: checkbox
        name: beep
        label: _("Beep on events")
        value: false
        hint: _("The same beeps as QTS. One short beep at start-up and when Reset is pressed. Three long beeps every 5 minutes while a fan has stopped. Two long beeps when a disk group has a problem or starts rebuilding. Three short beeps when USB Copy fails.")
      - type: select
        name: usbcopytask
        label: _("When USB Copy is pressed, run")
        value: ""
        valueField: uuid
        textField: description
        store:
          proxy:
            service: Qnap
            get:
              method: getTasks
        hint: _("Choose a task you made under System > Scheduled Tasks, for example one that copies a USB stick to a shared folder (see the plugin guide for a ready-made example). The USB light blinks while it runs and stays on for 10 seconds when it has finished.")
      - type: select
        name: resettask
        label: _("When Reset is held for 3 seconds, run")
        value: ""
        valueField: uuid
        textField: description
        store:
          proxy:
            service: Qnap
            get:
              method: getTasks
        hint: _("Shorter presses, and holds of 10 seconds or more, do nothing. The plugin never resets your settings or data.")
    buttons:
      - template: submit
      - template: cancel
        execute:
          type: url
          url: "/system/qnap"
