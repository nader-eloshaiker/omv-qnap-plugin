version: "1.0"
type: component
data:
  name: omv-system-qnap-drivers-form-page
  type: formPage
  config:
    request:
      service: Qnap
      get:
        method: getHardwareSettings
      post:
        method: setDriverSettings
    hints:
      - type: info
        text: _("New here? Click Set up drivers. It installs everything your QNAP hardware needs and turns on fan control. Run it again whenever this page says an update is available.")
    fields:
      - type: textInput
        name: driverstatus
        label: _("Hardware drivers")
        readonly: true
        submitValue: false
      - type: textInput
        name: headersstatus
        label: _("Driver build files")
        readonly: true
        submitValue: false
        hint: _("The drivers are rebuilt automatically after OpenMediaVault updates the system, using these files.")
      - type: textInput
        name: qm2cards
        label: _("QM2 expansion cards")
        readonly: true
        submitValue: false
      - type: divider
        title: _("Advanced")
      - type: checkbox
        name: loadmodule
        label: _("Start the hardware driver at boot")
        value: false
        hint: _("Set up drivers turns this on for you.")
      - type: checkbox
        name: loadqm2
        label: _("Start the QM2 card driver at boot")
        value: false
        hint: _("Only for QM2 expansion cards. Set up drivers turns this on when it finds a card.")
      - type: checkbox
        name: skiphwcheck
        label: _("Skip the controller check")
        value: false
        hint: _("Only for models whose hardware driver will not start otherwise. Set up drivers turns this on when it is needed.")
        modifiers:
          - type: visible
            constraint:
              operator: truthy
              arg0:
                prop: loadmodule
    buttons:
      - text: _("Set up drivers")
        class: omv-background-color-pair-primary
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Setting up the QNAP drivers ...")
              startOnInit: true
              request:
                service: Qnap
                method: setupDrivers
      - template: submit
      - template: cancel
        execute:
          type: url
          url: "/system/qnap"
