version: "1.0"
type: component
data:
  name: omv-system-qnap-drivers-form-page
  type: formPage
  config:
    request:
      service: Qnap
      get:
        method: getHardwareSettings
      post:
        method: setDriverSettings
    hints:
      - type: info
        text: _("Click Set up drivers once, right after installing this plugin. The button can only be clicked when something needs doing, for example after an update of this plugin that brings newer drivers. OpenMediaVault, Debian and other plugin updates never need it.")
    fields:
      - type: hidden
        name: needssetup
        value: true
        submitValue: false
      - type: textInput
        name: driverstatus
        label: _("Hardware drivers")
        readonly: true
        submitValue: false
      - type: textInput
        name: headersstatus
        label: _("Driver build files")
        readonly: true
        submitValue: false
        hint: _("When a system update installs a new Linux kernel, the drivers are rebuilt for it automatically using these files. Nothing to do.")
      - type: textInput
        name: qm2cards
        label: _("QM2 expansion cards")
        readonly: true
        submitValue: false
      - type: divider
        title: _("Advanced")
      - type: checkbox
        name: loadmodule
        label: _("Start the hardware driver at boot")
        value: false
        hint: _("Set up drivers turns this on for you.")
      - type: checkbox
        name: loadqm2
        label: _("Start the QM2 card driver at boot")
        value: false
        hint: _("Only for QM2 expansion cards. Set up drivers turns this on when it finds a card.")
      - type: checkbox
        name: skiphwcheck
        label: _("Skip the controller check")
        value: false
        hint: _("Leave this off. A few models with a different controller chip need it to start the driver; Set up drivers ticks it for you on those.")
        modifiers:
          - type: visible
            constraint:
              operator: truthy
              arg0:
                prop: loadmodule
    buttons:
      - text: _("Set up drivers")
        class: omv-background-color-pair-primary
        enabledConstraint:
          operator: truthy
          arg0:
            prop: needssetup
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Setting up the QNAP drivers ...")
              startOnInit: true
              request:
                service: Qnap
                method: setupDrivers
      - template: submit
      - template: cancel
        execute:
          type: url
          url: "/system/qnap"
