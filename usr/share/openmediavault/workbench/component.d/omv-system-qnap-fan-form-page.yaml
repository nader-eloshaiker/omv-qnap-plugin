version: "1.0"
type: component
data:
  name: omv-system-qnap-fan-form-page
  type: formPage
  config:
    request:
      service: Qnap
      get:
        method: getFanSettings
      post:
        method: setFanSettings
    hints:
      - type: info
        text: _("Pick a fan mode, click Save, then Apply. If fan control ever stops, the fans run at full speed to keep your NAS safe. Nothing happening? Open Drivers and click Set up drivers first.")
    fields:
      - type: checkbox
        name: enable
        label: _("Control the fans")
        value: false
        hint: _("Lets OpenMediaVault set the fan speed from the temperatures you choose below, like Smart Fan in QTS.")
      - type: select
        name: fanmode
        label: _("Fan mode")
        value: normal
        store:
          data:
            - ["quiet", _("Quiet (slower fans, runs a little warmer)")]
            - ["normal", _("Normal (recommended)")]
            - ["performance", _("Performance (cooler, louder)")]
            - ["custom", _("Custom (set your own temperatures)")]
            - ["manual", _("Fixed speed")]
        hint: _("Whatever the mode, the fans always go to full speed if something gets dangerously hot.")
      - type: numberInput
        name: manualspeed
        label: _("Fixed fan speed (%)")
        value: 63
        validators:
          min: 0
          max: 100
          patternType: integer
          required: true
        modifiers:
          - type: visible
            constraint:
              operator: eq
              arg0:
                prop: fanmode
              arg1: manual
      - type: divider
        title: _("What the fans react to")
      - type: checkbox
        name: usecpu
        label: _("Processor temperature")
        value: true
      - type: checkbox
        name: usesystem
        label: _("Temperature inside the case")
        value: true
      - type: checkbox
        name: usedisk
        label: _("Hard drive temperatures")
        value: true
        hint: _("Sleeping drives are never woken up to read them.")
      - type: checkbox
        name: usenvme
        label: _("NVMe SSD temperatures")
        value: true
      - type: checkbox
        name: useqm2
        label: _("Control the fan on QM2 expansion cards")
        value: true
        hint: _("Each card's fan follows the SSDs on that card. Untick to let the card run its own fan.")
      - type: container
        fields:
          - type: numberInput
            name: minspeed
            label: _("Lowest fan speed (%)")
            value: 25
            validators:
              min: 0
              max: 100
              patternType: integer
              required: true
            modifiers:
              - type: visible
                constraint:
                  operator: eq
                  arg0:
                    prop: fanmode
                  arg1: custom
          - type: numberInput
            name: maxspeed
            label: _("Highest fan speed (%)")
            value: 100
            validators:
              min: 0
              max: 100
              patternType: integer
              required: true
            modifiers:
              - type: visible
                constraint:
                  operator: eq
                  arg0:
                    prop: fanmode
                  arg1: custom
      - type: container
        fields:
          - type: numberInput
            name: cpulow
            label: _("Processor, fans start speeding up at (°C)")
            value: 55
            validators:
              min: 0
              max: 110
              patternType: integer
              required: true
            modifiers:
              - type: visible
                constraint:
                  operator: eq
                  arg0:
                    prop: fanmode
                  arg1: custom
          - type: numberInput
            name: cpuhigh
            label: _("Processor, fans at full speed at (°C)")
            value: 85
            validators:
              min: 0
              max: 110
              patternType: integer
              required: true
            modifiers:
              - type: visible
                constraint:
                  operator: eq
                  arg0:
                    prop: fanmode
                  arg1: custom
      - type: container
        fields:
          - type: numberInput
            name: syslow
            label: _("Inside the case, fans start speeding up at (°C)")
            value: 30
            validators:
              min: 0
              max: 110
              patternType: integer
              required: true
            modifiers:
              - type: visible
                constraint:
                  operator: eq
                  arg0:
                    prop: fanmode
                  arg1: custom
          - type: numberInput
            name: syshigh
            label: _("Inside the case, fans at full speed at (°C)")
            value: 45
            validators:
              min: 0
              max: 110
              patternType: integer
              required: true
            modifiers:
              - type: visible
                constraint:
                  operator: eq
                  arg0:
                    prop: fanmode
                  arg1: custom
      - type: container
        fields:
          - type: numberInput
            name: disklow
            label: _("Hard drives, fans start speeding up at (°C)")
            value: 38
            validators:
              min: 0
              max: 110
              patternType: integer
              required: true
            modifiers:
              - type: visible
                constraint:
                  operator: eq
                  arg0:
                    prop: fanmode
                  arg1: custom
          - type: numberInput
            name: diskhigh
            label: _("Hard drives, fans at full speed at (°C)")
            value: 48
            validators:
              min: 0
              max: 110
              patternType: integer
              required: true
            modifiers:
              - type: visible
                constraint:
                  operator: eq
                  arg0:
                    prop: fanmode
                  arg1: custom
      - type: container
        fields:
          - type: numberInput
            name: nvmelow
            label: _("NVMe SSDs, fans start speeding up at (°C)")
            value: 45
            validators:
              min: 0
              max: 110
              patternType: integer
              required: true
            modifiers:
              - type: visible
                constraint:
                  operator: eq
                  arg0:
                    prop: fanmode
                  arg1: custom
          - type: numberInput
            name: nvmehigh
            label: _("NVMe SSDs, fans at full speed at (°C)")
            value: 65
            validators:
              min: 0
              max: 110
              patternType: integer
              required: true
            modifiers:
              - type: visible
                constraint:
                  operator: eq
                  arg0:
                    prop: fanmode
                  arg1: custom
      - type: numberInput
        name: hysteresis
        label: _("Temperature tolerance (°C)")
        value: 3
        hint: _("How far a temperature must fall before the fans slow down again, so they do not keep speeding up and slowing down.")
        validators:
          min: 0
          max: 15
          patternType: integer
          required: true
        modifiers:
          - type: visible
            constraint:
              operator: eq
              arg0:
                prop: fanmode
              arg1: custom
      - type: divider
        title: _("Advanced")
      - type: numberInput
        name: interval
        label: _("Check the temperatures every (seconds)")
        value: 10
        validators:
          min: 2
          max: 120
          patternType: integer
          required: true
      - type: numberInput
        name: diskinterval
        label: _("Read hard drive temperatures every (seconds)")
        value: 60
        hint: _("Drives that have been idle are only read every 30 minutes, so they can go to sleep.")
        validators:
          min: 10
          max: 3600
          patternType: integer
          required: true
        modifiers:
          - type: visible
            constraint:
              operator: truthy
              arg0:
                prop: usedisk
    buttons:
      - template: submit
      - template: cancel
        execute:
          type: url
          url: "/system/qnap"
