version: "1.0"
type: component
data:
  name: omv-system-qnap-frontpanel-form-page
  type: formPage
  config:
    request:
      service: Qnap
      get:
        method: getHardwareSettings
      post:
        method: setFrontPanelSettings
    fields:
      - type: checkbox
        name: ledstatus
        label: _("Use the Status light")
        value: true
        hint: _("Works like QTS. Green means all is well. Red means a fan or sensor problem, a failed disk group or a volume that is nearly full. Blinking red means a disk group is running on fewer disks than it should (degraded). Green and red in turn means a disk group is being rebuilt.")
      - type: checkbox
        name: leddisk
        label: _("Use the disk lights")
        value: true
        hint: _("One light per drive bay and per QM2 card slot. Green when a disk is in the slot, flickering while it is busy, red when the disk reports a fault or has failed out of its disk group.")
      - type: numberInput
        name: ledbrightness
        label: _("Light brightness (%)")
        value: 100
        validators:
          min: 0
          max: 100
          patternType: integer
          required: true
      - type: checkbox
        name: lednight
        label: _("Dim the lights at night")
        value: false
        hint: _("Handy if the NAS is in a bedroom or living room.")
      - type: textInput
        name: lednightstart
        label: _("Night starts at")
        value: "22:00"
        validators:
          required: true
          pattern:
            pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
            errorData: _("Use 24-hour time, for example 22:30.")
        modifiers:
          - type: visible
            constraint:
              operator: truthy
              arg0:
                prop: lednight
      - type: textInput
        name: lednightend
        label: _("Night ends at")
        value: "07:00"
        validators:
          required: true
          pattern:
            pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
            errorData: _("Use 24-hour time, for example 07:00.")
        modifiers:
          - type: visible
            constraint:
              operator: truthy
              arg0:
                prop: lednight
      - type: numberInput
        name: lednightbrightness
        label: _("Brightness at night (%)")
        value: 10
        validators:
          min: 0
          max: 100
          patternType: integer
          required: true
        modifiers:
          - type: visible
            constraint:
              operator: truthy
              arg0:
                prop: lednight
      - type: numberInput
        name: volumefull
        label: _("Turn the Status light red when a volume is this full (%)")
        value: 95
        validators:
          min: 50
          max: 100
          patternType: integer
          required: true
    buttons:
      - template: submit
      - template: cancel
        execute:
          type: url
          url: "/system/qnap"
