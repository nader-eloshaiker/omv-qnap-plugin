version: "1.0"
type: component
data:
  name: omv-system-qnap-frontpanel-form-page
  type: formPage
  config:
    request:
      service: Qnap
      get:
        method: getHardwareSettings
      post:
        method: setFrontPanelSettings
    fields:
      - type: checkbox
        name: ledstatus
        label: _("Drive the status LED")
        value: true
        hint: _("Green when healthy. Solid red on a fan or sensor fault, a failed pool or a full volume; blinking red if a pool or RAID array is degraded or the service fails; green and red alternating while a pool resilvers or an array rebuilds. A scrub does not change it.")
      - type: checkbox
        name: leddisk
        label: _("Drive the disk LEDs")
        value: true
        hint: _("Drive bays and QM2 card M.2 slots. Green when a disk is present, blinking on disk activity, red on a S.M.A.R.T. failure or when a ZFS pool or RAID array has faulted the disk. Sleeping disks are not woken.")
      - type: numberInput
        name: ledbrightness
        label: _("LED brightness (%)")
        value: 100
        validators:
          min: 0
          max: 100
          patternType: integer
          required: true
      - type: numberInput
        name: volumefull
        label: _("Volume full warning (%)")
        value: 95
        hint: _("The status LED turns red when a ZFS pool or a mounted filesystem is at least this full.")
        validators:
          min: 50
          max: 100
          patternType: integer
          required: true
      - type: textInput
        name: leds
        label: _("Available LEDs")
        readonly: true
        submitValue: false
    buttons:
      - template: submit
      - template: cancel
        execute:
          type: url
          url: "/system/qnap"
