version: "1.0"
type: component
data:
  name: omv-system-qnap-hardware-form-page
  type: formPage
  config:
    request:
      service: Qnap
      get:
        method: getHardwareSettings
      post:
        method: setHardwareSettings
    fields:
      - type: divider
        title: _("Driver")
      - type: textInput
        name: driverstatus
        label: _("qnap8528 driver")
        readonly: true
        submitValue: false
      - type: textInput
        name: boardmodel
        label: _("Board codes (mainboard / backplane)")
        readonly: true
        submitValue: false
      - type: textInput
        name: ecfirmware
        label: _("EC firmware")
        readonly: true
        submitValue: false
      - type: textInput
        name: leds
        label: _("LEDs")
        readonly: true
        submitValue: false
      - type: checkbox
        name: loadmodule
        label: _("Load the qnap8528 module at boot")
        value: false
        hint: _("The driver must already be installed (e.g. via DKMS).")
      - type: checkbox
        name: skiphwcheck
        label: _("Skip the chip ID check (skip_hw_check)")
        value: false
        hint: _("Required on models with an ENE embedded controller, e.g. TS-253D, TS-453D, TS-464. Takes effect when the module is next loaded.")
        modifiers:
          - type: visible
            constraint:
              operator: truthy
              arg0:
                prop: loadmodule
      - type: textInput
        name: qm2cards
        label: _("QM2 expansion cards")
        readonly: true
        submitValue: false
      - type: checkbox
        name: loadqm2
        label: _("Load the qm2mod module at boot")
        value: false
        hint: _("For QM2 cards, using the qnap-qm2 driver (https://github.com/0xGiddi/qnap-qm2), which must already be installed.")
      - type: divider
        title: _("Front panel")
      - type: checkbox
        name: ledstatus
        label: _("Drive the status LED")
        value: true
        hint: _("Green when healthy, red on a fan or sensor fault, blinking red if the service fails.")
      - type: numberInput
        name: ledbrightness
        label: _("LED brightness (%)")
        value: 100
        validators:
          min: 0
          max: 100
          patternType: integer
          required: true
      - type: divider
        title: _("Power")
      - type: select
        name: powerrecovery
        label: _("After a power failure")
        value: unchanged
        store:
          data:
            - ["unchanged", _("Do not change")]
            - ["off", _("Stay off")]
            - ["on", _("Power on")]
            - ["last", _("Restore previous state")]
      - type: select
        name: eupmode
        label: _("EuP mode")
        value: unchanged
        hint: _("When enabled, standby power is minimised; Wake-on-LAN and power recovery are unavailable.")
        store:
          data:
            - ["unchanged", _("Do not change")]
            - ["off", _("Disabled")]
            - ["on", _("Enabled")]
      - type: checkbox
        name: rebootefi
        label: _("Use the EFI reboot method (reboot=efi)")
        value: false
        hint: _("Adds reboot=efi to the kernel command line via /etc/default/grub.d and runs update-grub. Fixes reboots hanging on several QNAP models. Takes effect after the next reboot; GRUB only.")
      - type: textInput
        name: rebootefiactive
        label: _("reboot=efi active in running kernel")
        readonly: true
        submitValue: false
    buttons:
      - template: submit
      - template: cancel
        execute:
          type: url
          url: "/system/qnap"
