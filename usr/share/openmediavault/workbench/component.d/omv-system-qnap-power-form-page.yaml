version: "1.0"
type: component
data:
  name: omv-system-qnap-power-form-page
  type: formPage
  config:
    request:
      service: Qnap
      get:
        method: getHardwareSettings
      post:
        method: setPowerSettings
    fields:
      - type: select
        name: powerrecovery
        label: _("When power comes back after a power cut")
        value: unchanged
        store:
          data:
            - ["unchanged", _("Keep the current setting")]
            - ["off", _("Stay off")]
            - ["on", _("Turn on")]
            - ["last", _("Go back to how it was (on if it was on)")]
      - type: select
        name: eupmode
        label: _("Lowest standby power (EuP)")
        value: unchanged
        hint: _("Uses almost no power when switched off, but the NAS can then not be woken over the network or turn itself on after a power cut.")
        store:
          data:
            - ["unchanged", _("Keep the current setting")]
            - ["off", _("Off")]
            - ["on", _("On")]
      - type: checkbox
        name: rebootefi
        label: _("Fix restarts that hang (recommended)")
        value: true
        hint: _("Many QNAP models freeze instead of restarting under Linux. This fixes it from the next restart on. Leave it on unless you know you do not need it.")
      - type: textInput
        name: rebootefiactive
        label: _("Restart fix active now")
        readonly: true
        submitValue: false
    buttons:
      - template: submit
      - template: cancel
        execute:
          type: url
          url: "/system/qnap"
